<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Regresi — Liga Nusantara</title>
    <style>
        :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #101318; color: #eef2f8; }
        body { max-width: 860px; margin: 0 auto; padding: 32px 20px; }
        h1 { margin-bottom: 8px; }
        p { color: #9da8b8; line-height: 1.5; }
        button { padding: 11px 16px; border: 0; border-radius: 7px; background: #3d9cff; color: #08111c; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        #summary { margin: 20px 0 10px; font-weight: 700; }
        #results { padding-left: 24px; }
        #results li { margin: 9px 0; }
        .passed { color: #48d597; }
        .failed { color: #ff6b78; }
        .test-frame { position: fixed; left: -10000px; top: 0; width: 1280px; height: 900px; border: 0; }
    </style>
</head>
<body>
    <main>
        <p>QA lokal tanpa dependensi tambahan</p>
        <h1>Tes Regresi Liga Nusantara</h1>
        <p>Tes berjalan di iframe terisolasi dan tidak membaca atau menulis save game pengguna.</p>
        <button id="runTests" type="button" disabled>Memuat aplikasi tes…</button>
        <div id="summary" role="status">Menunggu aplikasi tes dimuat.</div>
        <ol id="results"></ol>
    </main>
    <iframe id="appFrame" class="test-frame" src="../index.html?regression=1" title="Fixture tes aplikasi"></iframe>
    <script src="regression.js"></script>
</body>
</html>
